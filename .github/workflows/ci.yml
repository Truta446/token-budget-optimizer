name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Tests without optional features
        run: cargo test -p optimizer-core
      - name: Tests with parallel + huggingface
        run: cargo test -p optimizer-core --all-features
      - name: Benchmarks compile
        run: cargo bench -p optimizer-core --no-run

  node:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Build native addon and TypeScript
        run: pnpm --filter token-budget-optimizer build
      - name: Build adapters
        run: pnpm --filter token-budget-optimizer-langchain --filter token-budget-optimizer-ai-sdk build
      - name: Typecheck
        run: pnpm run typecheck
      - name: Smoke test (plain JavaScript)
        run: node packages/token-budget-optimizer/tests/smoke.mjs
      # The TypeScript test files use Node's built-in type stripping (verified locally on 22.22, 24.15, 26.10).
      - name: Library and CLI tests
        run: pnpm --filter token-budget-optimizer test
      - name: Adapter tests
        run: pnpm --filter token-budget-optimizer-langchain --filter token-budget-optimizer-ai-sdk test
      - name: Playground tests
        run: pnpm --filter @token-budget-optimizer/playground test
      - name: Examples
        run: pnpm run examples
      - name: Quality evaluation
        if: matrix.node >= 24 && matrix.os == 'ubuntu-latest'
        run: pnpm run eval

  wasm:
    name: WebAssembly build (full test suite on WASI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1-threads
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Build TypeScript and the WASI binding
        working-directory: packages/token-budget-optimizer
        run: |
          pnpm run build:native
          pnpm run build:wasm
          pnpm run build:ts
      - name: Library tests against the WASM engine
        working-directory: packages/token-budget-optimizer
        run: NAPI_RS_NATIVE_LIBRARY_PATH="$PWD/binding/token-budget-optimizer.wasi.cjs" node --test --test-reporter=spec tests/api.test.ts
      - name: Playground bundles the browser engine
        run: pnpm --filter @token-budget-optimizer/playground build && test -f apps/playground/public/wasm/engine.js

  package:
    name: npm pack dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter token-budget-optimizer build
      - run: npm pack --dry-run
        working-directory: packages/token-budget-optimizer
      - name: Adapters pack with the workspace dependency resolved
        run: |
          pnpm --filter token-budget-optimizer-langchain --filter token-budget-optimizer-ai-sdk build
          for p in langchain ai-sdk; do (cd packages/$p && pnpm pack --pack-destination /tmp && tar -xOf /tmp/token-budget-optimizer-$p-*.tgz package/package.json | grep '"token-budget-optimizer": "\^'); done

  alpine:
    name: Published package on Alpine (musl)
    runs-on: ubuntu-latest
    container: node:24-alpine
    steps:
      - name: Install the latest published version and run it
        working-directory: /tmp
        run: |
          npm init -y >/dev/null
          npm install token-budget-optimizer@latest
          ls node_modules | grep token-budget-optimizer
          cat > smoke.mjs <<'JS'
          import assert from "node:assert/strict";
          import { countTokens, optimizeContext, warmup } from "token-budget-optimizer";
          await warmup();
          const r = await optimizeContext({
            query: "credits",
            maxTokens: 60,
            documents: [
              { id: "a.md", content: "Each record costs one credit." },
              { id: "b.md", content: "Colors are configurable." },
            ],
          });
          assert.match(r.context, /costs one credit/);
          assert.equal(countTokens(r.context), r.stats.optimizedTokens);
          console.log(`musl ok on ${process.arch}: ${r.stats.optimizedTokens} tokens`);
          JS
          node smoke.mjs
