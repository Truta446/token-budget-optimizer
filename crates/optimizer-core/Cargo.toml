[package]
name = "optimizer-core"
description = "Deterministic, local-first context selection under a token budget"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
tiktoken-rs = "0.12.1"
unicode-normalization = "0.1.25"
rustc-hash = "2.1.3"
rayon = { version = "1.12.0", optional = true }
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"], optional = true }

[features]
default = []
# Parallel chunking and term analysis for large inputs (output is identical).
parallel = ["dep:rayon"]
# Register Hugging Face tokenizer.json files at runtime.
huggingface = ["dep:tokenizers"]

[dev-dependencies]
proptest = "1.12.0"
criterion = "0.8.2"

[[bench]]
name = "optimizer"
harness = false
